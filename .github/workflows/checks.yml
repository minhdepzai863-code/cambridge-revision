name: Cambridge Revision checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify cloud record transactions
        run: psql -v ON_ERROR_STOP=1 -f tests/revision-records.sql
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: test-password
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright@1.57.0
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:browser
